server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  # Spring Boot 3 中 Redis 的配置前缀由 spring.redis 变更为 spring.data.redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥（jjwt 0.11 起 HS256 要求密钥长度不小于 256 bit，即 32 字节）
    admin-secret-key: itcast-sky-take-out-admin-secret-key
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    # 用户端（微信小程序）jwt 配置
    user-secret-key: itheima-sky-take-out-user-secret-key
    user-ttl: 7200000
    user-token-name: authentication

# 接口文档配置（Knife4j 4.x 底层为 springdoc-openapi）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  default-flat-param-object: true